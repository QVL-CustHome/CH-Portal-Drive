# CI/CD CH-Portal-Drive — base commune : template node QVL-ToolBox/PipeLine
include:
  - remote: "https://raw.githubusercontent.com/QVL-ToolBox/PipeLine/main/node.gitlab-ci.yml"

stages:
  - test
  - build
  - deploy

# ce repo n'a pas (encore) prettier -> lint = eslint seul
lint:
  script:
    - npm ci
    - npm run lint

# la config de prod est injectee UNIQUEMENT au build (les tests gardent les valeurs par defaut)
build:
  variables:
    VITE_AUTH_PORTAL_URL: "https://ch-auth.qvl-project.com"
    VITE_REDIRECT_COOKIE_DOMAIN: ".qvl-project.com"
  script:
    - npm ci
    # dependance en dist-tag latest : choix assume, voir docs/CANOPUI-LATEST.md
    - npm install canopui@latest # toujours la derniere CanopUI dans l'artefact deploye
    - npm run build
    # marqueur relu au demarrage par canopui-autorebuild (WSL) pour savoir quelle
    # version de CanopUI est reellement embarquee dans le bundle deploye
    - node -p "require('./node_modules/canopui/package.json').version" > dist/.canopui-version
  artifacts:
    paths: [dist/]
    expire_in: 1 week

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  dependencies: [build]
  script:
    - sudo /usr/local/bin/ch-deploy-portal ch-portal-drive "$CI_PROJECT_DIR"

# auto-pull du clone local persistant sur /mnt/c (evite les checkouts perimes en local)
#
# Deux pieges corriges ici. D'abord `pull --ff-only origin main` avance la
# branche COURANTE : ce clone traina longtemps sur fix/sso-redirect-cookie-domain,
# que le job faisait avancer a la place de main -- main est reste gele des
# semaines sans que rien ne le signale. Ensuite le fetch depend d'identifiants
# gitlab.com que le clone n'a pas forcement en cache, et l'echec passait
# inapercu. On se replace donc explicitement sur main, et on fetch avec le jeton
# du job.
update-checkout:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
  dependencies: []
  variables:
    CLONE_LOCAL: /mnt/c/QVL/QVL-CustHome/CH-Portal-Drive
  script:
    - git -C "$CLONE_LOCAL" fetch "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" main
    - git -C "$CLONE_LOCAL" checkout main
    - git -C "$CLONE_LOCAL" merge --ff-only FETCH_HEAD
    - git -C "$CLONE_LOCAL" log --oneline -1

# ce portail n'a pas encore de tests unitaires -> vitest ne doit pas echouer sur suite vide
test:
  script:
    - npm ci
    - npm test -- --passWithNoTests
